<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack técnico | LOGStack </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header>
        <nav>
            <img id="Logo" src="./img/Logo-LOGStack.png" alt="">
            <button type="button" id="Btn-Cerrar-Sesion" title="Cerrar sesión">
                <span class="material-symbols-outlined">logout</span>
            </button>
            <hr>
            <div id="Info-Usuario-Nav">
                <div id="Pfp">F</div>
                <div class="datos-perfil">
                    <p id="Perfil-Nombre">Firulais</p>
                    <p id="Perfil-Dpto">Soporte</p>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section id="Parte-Sup">
            <div id="Parte-Sup-Iz">
                <h1>Panel de gestión técnica y soporte</h1>
                <p>Administre la asignación, resolución y prioridades de reclamos.</p>
            </div>
            <div id="Parte-Sup-De">
                <button><a href="index.html"><span class="material-symbols-outlined">add_circle</span>Crear ticket</a></button>
            </div>
        </section>
        <hr>
        <section id="Cont-Aviso-TE">
           <section>
                <span class="material-symbols-outlined">warning</span>
                <div id="Texto-Cont-Aviso-TE">
                    <h3>¡Atención! Hay tickets estancados</h3>
                    <p>Existen 2 ticket(s) estancados sin avance desde hace más de 3 días.</p>
                </div>
           </section>
           <button id="Ver-Estancados">Ver estancados</button>
        </section>
        <section id="Filtro-T">
            <section>
                <span class="material-symbols-outlined">filter_alt</span>
                <h3>FILTRAR POR:</h3>
                <select id="Lista-Tipo-Problema" name="Tipos-Problema">
                    <option value="Todos">Todos los tipos</option>
                    <option value="Hardware">Hardware/Soporte</option>
                    <option value="Desarrollo">Desarrollo</option>
                    <option value="Bugs Producción">Bugs Producción</option>
                </select>
                <select id="Lista-Estado" name="Estado">
                    <option value="Todos">Todos los estados</option>
                    <option value="Pendiente">Pendientes</option>
                    <option value="En proceso">En proceso</option>
                    <option value="Resuelto">Resueltos</option>
                </select>
            <p>Mostrando 0 tickets</p>
            </section>
        </section>
        
        <section id="Tickets">
        </section>
        <div id="Modal-Gestion" class="modal-oculto">
            <div class="modal-contenido">
                <div class="modal-encabezado">
                    <h2 id="Modal-Titulo">Gestionar Ticket</h2>
                    <button type="button" id="Cerrar-Modal">X</button>
                </div>
                <form id="Form-Gestion">
                    <input type="hidden" id="Gestion-ID-Ticket">
                    
                    <label for="Gestion-Estado">Estado del Ticket:</label>
                    <select id="Gestion-Estado">
                        <option value="Pendiente">Pendiente</option>
                        <option value="En proceso">En proceso</option>
                        <option value="Resuelto">Resuelto</option>
                    </select>

                    <label for="Gestion-Urgencia">Nivel de Urgencia:</label>
                    <select id="Gestion-Urgencia">
                        <option value="Bajo">Bajo</option>
                        <option value="Medio">Medio</option>
                        <option value="Urgente">Urgente</option>
                    </select>

                    <label for="Gestion-Asignado">Técnico Asignado:</label>
                    <select id="Gestion-Asignado">
                        <option value="Sin asignar">Sin asignar</option>
                    </select>

                    <div class="modal-botones">
                        <button type="button" id="Cancelar-Gestion">Cancelar</button>
                        <button type="submit" id="Guardar-Gestion">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="soporte.js"></script>
</body>
</html>
