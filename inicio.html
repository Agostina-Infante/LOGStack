<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión|LOQStack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/Logo-LOGStack.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header>
        <nav>
            <img id="Logo" src="./img/Logo-LOGStack.png" alt="">
        </nav>
    </header>
    <div id="FormularioInicio">
        <h1>Iniciar Sesión</h1>
        <form id="formularioLogin">
            <section>
                <h3 for="usuario">Usuario</h3>
                <input type="text" id="usuario" placeholder="Ingrese su usuario">
            </section>
            <section>
                <h3 for="password">Contraseña</h3>
                <input type="password" id="password" placeholder="Ingrese su contraseña">
            </section>
            <br>
            <button type="submit">Ingresar</button>
        </form>
        <p id="respuesta" style="font-weight: bold;"></p>
    </div>
    <script src="login.js"></script>
</body>
</html>
