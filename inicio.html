<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | LOGstack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./img/Logo-LOGStack.png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header>
        <nav>
            <img id="Logo" src="./img/Logo-LOGStack.png" alt="">
            <hr>
        </nav>
    </header>
    <main>
        <section id="Formulario">
            <h2>Iniciar sesión</h2>
            <div>
                <h3>Usuario:</h3>
                <input placeholder="Ingrese su usuario" type="text">
                <h3>Contraseña:</h3>
                <input placeholder="Ingrese su contraseña" type="password">
            </div>
            <hr>
            <div>
                <button>Ingresar</button>
            </div>
        </section>
    </main>
</body>

</html>
